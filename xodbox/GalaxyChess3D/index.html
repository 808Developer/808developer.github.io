                audio.playSelect(true);
            } else {
                icon.textContent = 'volume_off';
                label.textContent = 'Muted';
                btn.classList.replace('text-amber-300', 'text-stone-400');
            }
        });

        function resetNewGame() {
            if (activeMoveAnimId) {
                cancelAnimationFrame(activeMoveAnimId);
                activeMoveAnimId = null;
            }
            isAnimating = false;
            clearTimeout(aiThinkTimer);
            aiThinkTimer = null;
            chess.reset();
            timeoutWinner = null;
            timeRemaining.w = clockDurationSeconds;
            timeRemaining.b = clockDurationSeconds;
            selectedSquare = null;
            lastMoveSquares = [];
            clearSquareHighlights();
            rebuildAllPiecesFromBoard();
            setCameraPreset(playerColor === 'w' ? 'white' : 'black');
            showToast(playerColor === 'w' ? 'New Match: You play Marble' : 'New Match: You play Ruby');
            triggerAITurnIfNeeded();
        }

        document.getElementById('btn-new').addEventListener('click', resetNewGame);
        document.getElementById('btn-modal-restart').addEventListener('click', resetNewGame);

        // Promotion Dialog Selection
        document.querySelectorAll('.promo-Option').forEach(btn => {
            btn.addEventListener('click', () => {
                const promoPiece = btn.dataset.promo;
                document.getElementById('promotion-modal').classList.add('hidden');
                document.getElementById('promotion-modal').classList.remove('flex');
                if (pendingPromotionMove) {
                    const moveObj = {
                        from: pendingPromotionMove.from,
                        to: pendingPromotionMove.to,
                        promotion: promoPiece
                    };
                    pendingPromotionMove = null;
                    selectedSquare = null;
                    executeAnimatedMove(moveObj, () => {
                        if (gameMode === '2p' && !camState.autoOrbit) {
                            setCameraPreset(chess.turn() === 'w' ? 'white' : 'black');
                        }
                        triggerAITurnIfNeeded();
                    });
                }
            });
        });

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            // Automatically adjust camera distance so the chessboard stays fully in view on mobile portrait/landscape
            camState.targetRadius = camState.baseRadius * getResponsiveZoomFactor();
        });

        /***********************************************************************
         * 11. MAIN ANIMATION LOOP (Idle Breathing, Shatter Physics, Camera)
         ***********************************************************************/
        let lastFrameTime = performance.now();

        function animate(now) {
            requestAnimationFrame(animate);

            const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
            lastFrameTime = now;
            const elapsed = now * 0.001;

            // 1. Smooth Camera Damping & Cinematic Orbit
            if (camState.autoOrbit) {
                camState.targetTheta += dt * 0.18;
            }
            camState.theta += (camState.targetTheta - camState.theta) * 0.08;
            camState.phi += (camState.targetPhi - camState.phi) * 0.08;
            camState.radius += (camState.targetRadius - camState.radius) * 0.08;

            camera.position.x = camState.radius * Math.sin(camState.phi) * Math.sin(camState.theta);
            camera.position.y = camState.radius * Math.cos(camState.phi);
            camera.position.z = camState.radius * Math.sin(camState.phi) * Math.cos(camState.theta);
            camera.lookAt(0, 0.4, 0);

            // 2. Custom Piece Idle Animations (Breathing, Swaying & Levitating Runes)
            Object.values(pieceMeshes).forEach(mesh => {
                const seed = mesh.userData.seed || 0;
                const isSelected = mesh.userData.square === selectedSquare;

                // Subtle magical breathing & swaying of the sculpted body
                if (mesh.userData.bodyGroup && !isAnimating) {
                    const hoverOffset = isSelected
                        ? 0.22 + Math.sin(elapsed * 5) * 0.05
                        : Math.sin(elapsed * 2.1 + seed) * 0.025;
                    mesh.userData.bodyGroup.position.y = Math.max(0, hoverOffset);
                    mesh.userData.bodyGroup.rotation.z = Math.sin(elapsed * 1.4 + seed) * 0.018;
                }

                // Levitating crown/orb finials rotating above pieces
                if (mesh.userData.floatingPart) {
                    mesh.userData.floatingPart.rotation.y = elapsed * 1.6 + seed;
                }
            });

            // 3. Rotate Valid Move Capture Rune Rings & Pulse Illuminated Destination Squares
            Object.values(highlightMeshes).forEach(hl => {
                if (hl.visible) {
                    if (hl.userData.square === checkKingSquare) {
                        // Intense crimson danger pulse on the square of a King in Check or Checkmate
                        hl.userData.capRingMesh.rotation.z -= dt * 2.4;
                        hl.userData.tileGlowMesh.material.opacity = 0.55 + Math.sin(elapsed * 7.5) * 0.22;
                        const kingSqMesh = squareMeshes[checkKingSquare];
                        if (kingSqMesh) {
                            const pulseR = 0.55 + Math.sin(elapsed * 7.5) * 0.25;
                            kingSqMesh.material.emissive.setRGB(pulseR, 0.04, 0.04);
                        }
                    } else if (hl.userData.capRingMesh.visible) {
                        hl.userData.capRingMesh.rotation.z += dt * 1.5;
                        hl.userData.tileGlowMesh.material.opacity = 0.38 + Math.sin(elapsed * 5.0) * 0.12;
                    } else {
                        hl.userData.tileGlowMesh.material.opacity = 0.28 + Math.sin(elapsed * 4.0) * 0.10;
                    }
                }
            });

            // 3b. Animate the King Cleaving in Half on Checkmate
            if (checkmateBreakState) {
                const st = checkmateBreakState;
                st.age += dt;
                const t = Math.min(1, st.age / st.duration);

                if (t < 0.28) {
                    // Phase 1: Dramatic upward crack & fracture separation at the waist
                    const p = t / 0.28;
                    const easeOut = 1 - Math.pow(1 - p, 3);
                    st.upper.position.y = 0.85 + easeOut * 0.26;
                    st.upper.position.x = st.dirX * easeOut * 0.16;
                    st.upper.position.z = st.dirZ * easeOut * 0.16;
                    st.upper.rotation.z = -st.dirX * easeOut * 0.48;
                    st.upper.rotation.x = st.dirZ * easeOut * 0.48;
                } else {
                    // Phase 2: Upper torso & crown topple off the base and crash onto the board
                    const p = (t - 0.28) / 0.72;
                    const fallEase = p * p;
                    st.upper.position.x = st.dirX * (0.16 + p * 0.54);
                    st.upper.position.z = st.dirZ * (0.16 + p * 0.54);

                    // Fall to board floor (y = 0.22 relative to piece root) with a heavy bounce
                    const targetY = 0.22;
                    let currentY = 1.11 - fallEase * (1.11 - targetY);
                    if (p > 0.72) {
                        if (!st.bounced) {
                            st.bounced = true;
                            audio.playStoneSlide(0.22);
                        }
                        const bounceP = (p - 0.72) / 0.28;
                        currentY = targetY + Math.sin(bounceP * Math.PI) * 0.10;
                    }
                    st.upper.position.y = currentY;

                    // Rotate past 90 degrees so the severed crown half lies fallen on its side
                    const tiltAngle = 0.48 + fallEase * 1.28;
                    st.upper.rotation.z = -st.dirX * tiltAngle;
                    st.upper.rotation.x = st.dirZ * tiltAngle;
                }

                if (t >= 1) {
                    checkmateBreakState = null;
                }
            }

            // 4. Update Shattered Stone Shards Physics
            for (let i = activeShards.length - 1; i >= 0; i--) {
                const s = activeShards[i];
                s.age += dt;
                if (s.age >= s.maxAge) {
                    scene.remove(s.mesh);
                    activeShards.splice(i, 1);
                    continue;
                }

                // Gravity & velocity integration
                s.vel.y -= 13.5 * dt;
                s.mesh.position.addScaledVector(s.vel, dt);

                // Floor bounce on the marble chessboard
                if (s.mesh.position.y < 0.06) {
                    s.mesh.position.y = 0.06;
                    s.vel.y = -s.vel.y * 0.42;
                    s.vel.x *= 0.72;
                    s.vel.z *= 0.72;
                    s.rotVel.multiplyScalar(0.65);
                }

                s.mesh.rotation.x += s.rotVel.x * dt;
                s.mesh.rotation.y += s.rotVel.y * dt;
                s.mesh.rotation.z += s.rotVel.z * dt;

                // Fade out in final 35% of life
                const lifeRatio = s.age / s.maxAge;
                if (lifeRatio > 0.65) {
                    s.mesh.material.opacity = Math.max(0, 1 - (lifeRatio - 0.65) / 0.35);
                }
            }

            // 5. Update Magical Move Trail Particles
            for (let i = activeTrailParticles.length - 1; i >= 0; i--) {
                const pt = activeTrailParticles[i];
                pt.age += dt;
                if (pt.age >= pt.maxAge) {
                    scene.remove(pt.mesh);
                    activeTrailParticles.splice(i, 1);
                    continue;
                }
                pt.mesh.position.y += dt * 0.55;
                pt.mesh.rotation.y += dt * 3;
                pt.mesh.material.opacity = 0.85 * (1 - pt.age / pt.maxAge);
                const scale = 1 - (pt.age / pt.maxAge) * 0.6;
                pt.mesh.scale.set(scale, scale, scale);
            }

            // 6. Subtle Cathedral Dust Motes Drift & Candlelight Flicker
            if (scene.userData.dustParticles) {
                scene.userData.dustParticles.rotation.y = elapsed * 0.02;
            }
            warmLight.intensity = 0.75 + Math.sin(elapsed * 7.3) * 0.04 + Math.cos(elapsed * 13.1) * 0.03;

            // 7. Dual Countdown Clocks Tick (Only when enabled and match is active)
            if (clockDurationSeconds > 0 && !isGameTerminated()) {
                const activeTurn = chess.turn();
                timeRemaining[activeTurn] = Math.max(0, timeRemaining[activeTurn] - dt);
                updateClockDisplay();

                if (timeRemaining[activeTurn] <= 0) {
                    timeoutWinner = activeTurn === 'w' ? 'b' : 'w';
                    selectedSquare = null;
                    clearSquareHighlights();
                    audio.playCathedralBell();
                    updateD();
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = function () {
            rebuildAllPiecesFromBoard();
            showToast('Click or tap any Marble piece to begin');
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
